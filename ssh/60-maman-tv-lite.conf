# SSH hardening for the Maman TV Lite.
#
# PasswordAuthentication is deliberately left ENABLED (it is set to "yes" by
# 50-cloud-init.conf): an accepted safety net while the network at the
# installation site is still unknown. Verified empirically, that password is
# only exploitable from the local network: Tailscale intercepts port 22 and
# never reaches sshd, and the Cloudflare tunnel only routes the API.
#
# root, on the other hand, has no reason to be reachable: administration goes
# through a named account and then sudo, which makes it traceable.
PermitRootLogin no
